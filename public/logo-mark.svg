<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg64" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#80AD8D"/>
      <stop offset="100%" stop-color="#4F8462"/>
    </linearGradient>
    <filter id="glow64" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E0501C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14.5" fill="url(#bg64)"/>
  <ellipse cx="17" cy="15" rx="30" ry="25" fill="rgba(255,255,255,0.07)"/>

  <!-- Wheel rim -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.90"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="white" stroke-width="0.6" stroke-opacity="0.16"/>
  <!-- Sheen arc -->
  <path d="M48.6 15.4 A24 24 0 0 1 56 32"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.30"/>

  <!-- 3 Y-spokes -->
  <line x1="32" y1="8"    x2="32" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.78"/>
  <line x1="52.8" y1="44" x2="32" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.78"/>
  <line x1="11.2" y1="44" x2="32" y2="32" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.78"/>

  <!-- Spoke nipples -->
  <circle cx="32"   cy="8"  r="1.8" fill="rgba(255,255,255,0.42)"/>
  <circle cx="52.8" cy="44" r="1.8" fill="rgba(255,255,255,0.42)"/>
  <circle cx="11.2" cy="44" r="1.8" fill="rgba(255,255,255,0.42)"/>

  <!-- Fuel drop hub -->
  <path d="M32 17
           C29 20 22.5 25.5 22.5 31.5
           C22.5 35.5 26.8 38.7 32 38.7
           C37.2 38.7 41.5 35.5 41.5 31.5
           C41.5 25.5 35 20 32 17 Z"
        fill="#F08060"
        filter="url(#glow64)"/>

  <!-- Highlight -->
  <ellipse cx="27.7" cy="22.3" rx="2" ry="3.3"
           fill="rgba(255,255,255,0.30)"
           transform="rotate(-22 27.7 22.3)"/>

  <!-- Axle -->
  <circle cx="32" cy="31.5" r="1.8" fill="white" opacity="0.92"/>
</svg>
