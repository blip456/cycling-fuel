<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Sage green background -->
  <rect width="192" height="192" rx="44" fill="#6B9E7B"/>

  <!-- Ambient top-left highlight for depth -->
  <ellipse cx="52" cy="44" rx="90" ry="75" fill="rgba(255,255,255,0.06)"/>

  <!-- Flame body — filled white, slightly off-opaque so the green breathes through -->
  <path d="M96 34
           C109 52 130 76 130 106
           C130 128 122 146 112 155
           C108 159 104 162 96 162
           C88 162 84 159 80 155
           C70 146 62 128 62 106
           C62 76 83 52 96 34
           Z"
        fill="#FAFAF7" opacity="0.95"/>

  <!-- Inner warm core — peach teardrop sitting inside the flame -->
  <path d="M96 96
           C90 114 84 132 87 148
           C89 156 93 161 96 162
           C99 161 103 156 105 148
           C108 132 102 114 96 96
           Z"
        fill="#F08060" opacity="0.50"/>
</svg>
