<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Dark forest-green background -->
  <rect width="192" height="192" fill="#3B6B4A"/>

  <!-- Bottle rotated -38° around canvas centre -->
  <g transform="rotate(-38 96 96)"
     fill="none"
     stroke="white"
     stroke-width="8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!--
      Bottle silhouette (clockwise from spout top-left):
        concave spout tip → right spout → flare to cap → right cap →
        right shoulder S-curve → right waist bulge → right body →
        rounded bottom arc → left body → left waist →
        left shoulder → left cap → left spout → close
    -->
    <path d="
      M88 20  Q96 15 104 20
      L104 34
      Q107 36 116 38  L116 56
      Q122 68 128 80
      Q134 92 128 100
      L128 162
      Q96 178 64 162
      L64 100
      Q58 92 64 80
      Q70 68 76 56
      L76 38  Q85 36 88 34
      Z
    "/>

    <!-- H-grip: left slot -->
    <line x1="88" y1="38" x2="88" y2="56"/>
    <!-- H-grip: right slot -->
    <line x1="104" y1="38" x2="104" y2="56"/>
    <!-- H-grip: cross-bar -->
    <line x1="76" y1="47" x2="116" y2="47"/>

    <!-- FUEL — large bold text filling the body -->
    <text
      x="96" y="148"
      font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
      font-size="30"
      font-weight="900"
      text-anchor="middle"
      fill="white"
      stroke="none"
      letter-spacing="2"
    >FUEL</text>

  </g>
</svg>
