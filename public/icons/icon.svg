<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    CycleFuel leaf icon — the app's leaf mark (as seen on the Plan tab and the
    home CTA) rendered as a solid white leaf on a deep-forest square. Opaque,
    full-bleed background so iOS/Android masks round it cleanly; the blade is
    filled (legible at 16px) with a forest vein for detail at larger sizes.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43684F"/>
      <stop offset="0.55" stop-color="#375A45"/>
      <stop offset="1" stop-color="#2A3830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Leaf (lucide "Leaf"), scaled & centered on the blade's visual mass -->
  <g transform="translate(116 128) scale(11.67)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" fill="#FFFFFF"/>
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" fill="none" stroke="#2C3930" stroke-width="1.6"/>
  </g>
</svg>
