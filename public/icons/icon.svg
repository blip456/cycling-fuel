<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Solid sage green background — square, platform handles rounding -->
  <rect width="192" height="192" fill="#6B9E7B"/>

  <!-- Bottle drawn upright, rotated -38° around canvas centre -->
  <g transform="rotate(-38 96 96)"
     fill="none"
     stroke="white"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!--
      Full bottle silhouette — single closed path, clockwise:
        nozzle tip → right tab → right shoulder → right body →
        rounded bottom → left body → left shoulder → left tab → close
    -->
    <path d="
      M89 22  Q96 17 103 22
      L103 39  L116 39  L116 57
      Q120 65 125 75
      L125 163
      Q96 180 67 163
      L67 75
      Q72 65 76 57
      L76 39  L89 39
      Z
    "/>

    <!-- Tab inner verticals — turn the cap rectangle into an H-slot -->
    <line x1="89"  y1="39" x2="89"  y2="57"/>
    <line x1="103" y1="39" x2="103" y2="57"/>

    <!-- H cross-bar (finger-pull grip) -->
    <line x1="76" y1="49" x2="116" y2="49"/>

    <!-- Body ridge 1 — gentle outward arc (contour moulding) -->
    <path d="M67 102 Q96 106 125 102"/>

    <!-- Body ridge 2 -->
    <path d="M67 117 Q96 121 125 117"/>

    <!-- FUEL — bold, fills the lower body panel -->
    <text
      x="96" y="153"
      font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
      font-size="25"
      font-weight="900"
      text-anchor="middle"
      fill="white"
      stroke="none"
      letter-spacing="3"
    >FUEL</text>

  </g>
</svg>
